<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manshi Birthday Surprise</title>
<style>
  body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    flex-direction: column;
    text-align: center;
  }

  h1 {
    font-size: 3em;
    color: #fff;
    text-shadow: 2px 2px #ff0000;
    animation: rainbow 3s linear infinite;
  }

  @keyframes rainbow {
    0% {color: red;}
    14% {color: orange;}
    28% {color: yellow;}
    42% {color: green;}
    57% {color: blue;}
    71% {color: indigo;}
    85% {color: violet;}
    100% {color: red;}
  }

  #candle {
    width: 50px;
    margin: 20px auto;
    cursor: pointer;
    transition: transform 0.3s;
  }

  #candle:hover {
    transform: scale(1.2) rotate(-5deg);
  }

  .blow {
    animation: blow 1s forwards;
  }
